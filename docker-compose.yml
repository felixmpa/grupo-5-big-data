# Stack del proyecto IoT + Big Data.
# Cada PR agrega aquí los servicios de su componente.
name: iot-bigdata

# Configuración de Hadoop compartida por namenode y datanode.
# La imagen oficial convierte cada variable en una propiedad del XML:
# CORE-SITE.XML_fs.defaultFS -> <property>fs.defaultFS</property> en core-site.xml
x-hadoop-config: &hadoop-config
  CORE-SITE.XML_fs.defaultFS: hdfs://namenode:8020
  HDFS-SITE.XML_dfs.namenode.rpc-address: namenode:8020
  HDFS-SITE.XML_dfs.namenode.name.dir: /data/namenode
  HDFS-SITE.XML_dfs.datanode.data.dir: /data/datanode
  # Un solo datanode: no hay dónde guardar copias extra.
  HDFS-SITE.XML_dfs.replication: "1"
  # Prototipo: sin control de permisos para que Spark escriba sin configurar usuarios.
  HDFS-SITE.XML_dfs.permissions.enabled: "false"

services:
  # --- PR 1: sensores + broker MQTT ---
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  sensores:
    build: ./sensores
    environment:
      MQTT_HOST: mosquitto
      NUM_MAQUINAS: 5
      INTERVALO_SEGUNDOS: 1
    depends_on:
      - mosquitto
    restart: unless-stopped

  # Opcional: simulador visual con Node-RED.
  # Se levanta solo con: docker compose --profile nodered up -d
  node-red:
    image: nodered/node-red:4.0
    profiles: ["nodered"]
    ports:
      - "1880:1880"
    depends_on:
      - mosquitto

  # --- PR 2: Kafka + puente MQTT -> Kafka ---
  kafka:
    image: apache/kafka:4.2.0
    ports:
      - "9094:9094"   # para conectarse desde fuera de Docker (localhost:9094)
    environment:
      # Un solo nodo que hace de broker y de controller (modo KRaft, sin Zookeeper).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNA: para los contenedores (kafka:9092)
      # EXTERNA: para scripts locales con uv (localhost:9094)
      KAFKA_LISTENERS: INTERNA://:9092,CONTROLLER://:9093,EXTERNA://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNA://kafka:9092,EXTERNA://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNA:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNA:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNA
      # Con un solo nodo no se puede replicar.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      # Los mensajes se guardan en un volumen: sobreviven a "docker compose down".
      # Para borrarlos: docker compose down -v
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Crea el topic "sensores" una vez que Kafka está listo y termina.
  kafka-init:
    image: apache/kafka:4.2.0
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server=kafka:9092
      - --create
      - --if-not-exists
      - --topic=sensores
      - --partitions=3
      - --replication-factor=1
      - --config=retention.ms=604800000   # guarda 7 días

  puente-mqtt-kafka:
    build: ./puente-mqtt-kafka
    environment:
      MQTT_HOST: mosquitto
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: sensores
    depends_on:
      mosquitto:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # --- PR 3: InfluxDB (series de tiempo) ---
  influxdb:
    image: influxdb:2.8
    ports:
      - "8086:8086"   # API y web: http://localhost:8086
    environment:
      # Configuración inicial automática (solo la primera vez).
      # Credenciales de demo: en producción irían en un archivo .env fuera del repo.
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin12345
      DOCKER_INFLUXDB_INIT_ORG: grupo5
      DOCKER_INFLUXDB_INIT_BUCKET: sensores
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: token-demo-grupo5
    volumes:
      - influxdb-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  consumidor-influxdb:
    build: ./consumidor-influxdb
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: sensores
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: token-demo-grupo5
      INFLUX_ORG: grupo5
      INFLUX_BUCKET: sensores
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      influxdb:
        condition: service_healthy
    restart: unless-stopped

  # --- PR 4: Data Lake en HDFS ---
  namenode:
    image: apache/hadoop:3.4.2
    hostname: namenode
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870"   # web de HDFS: http://localhost:9870
      - "8020:8020"   # para Spark corriendo fuera de Docker (PR 5)
    environment:
      <<: *hadoop-config
      # La primera vez formatea el sistema de archivos (si la carpeta no existe).
      ENSURE_NAMENODE_DIR: /data/namenode
    volumes:
      - namenode-data:/data
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -safemode get | grep -q OFF"]
      interval: 5s
      timeout: 10s
      retries: 30

  datanode:
    image: apache/hadoop:3.4.2
    hostname: datanode
    command: ["hdfs", "datanode"]
    ports:
      - "9864:9864"   # WebHDFS escribe los datos directamente en el datanode
      - "9866:9866"   # para Spark corriendo fuera de Docker (PR 5)
    environment:
      <<: *hadoop-config
    volumes:
      - datanode-data:/data
    depends_on:
      - namenode

  consumidor-hdfs:
    build: ./consumidor-hdfs
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: sensores
      HDFS_URL: http://namenode:9870
      HDFS_RUTA: /datalake/crudo/sensores
      SEGUNDOS_POR_ARCHIVO: 60
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      namenode:
        condition: service_healthy
      datanode:
        condition: service_started
    restart: unless-stopped

  # --- PR 5: procesamiento con Spark ---
  # Es un proceso por lotes: no queda corriendo. Se ejecuta cuando se necesita:
  #   docker compose run --rm spark
  spark:
    image: apache/spark:4.0.1-python3
    profiles: ["spark"]
    command:
      - /opt/spark/bin/spark-submit
      - --master=local[*]        # usa todos los núcleos de este contenedor
      - --driver-memory=1g
      - --conf=spark.log.level=WARN
      - /app/procesar.py
    environment:
      HDFS_URL: hdfs://namenode:8020
      VENTANA: 30 seconds
    volumes:
      - ./spark:/app:ro
    ports:
      - "4040:4040"   # web de Spark mientras corre (con: docker compose run --rm --service-ports spark)
    depends_on:
      namenode:
        condition: service_healthy

volumes:
  kafka-data:
  influxdb-data:
  namenode-data:
  datanode-data:

# Red compartida para que los servicios se encuentren por nombre
# (por ejemplo: mosquitto, kafka, influxdb).
networks:
  default:
    name: iot-net
